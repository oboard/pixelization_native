[workspace]
members = ["crates/pixelization", "crates/pixelization-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Upstream-NonCommercial"
repository = "https://github.com/WuZongWei6/Pixelization"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "5.1"
rayon = "1.10"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
ndarray = "0.17"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
libc = "0.2"

