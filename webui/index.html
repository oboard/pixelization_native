<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#f5f8f6" />
    <script>
      // Set the saved theme before styles paint; storage may be blocked.
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('pixelization-theme') || 'system'; } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'forest' : 'emerald';
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <meta
      name="description"
      content="上传图片，调整精细度，一键生成像素画图纸，简单实用的像素画生成工具"
    />

    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <title>Mardize拼豆底稿生成器 | Perler Beads Generator</title>
  </head>
